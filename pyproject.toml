[project]
name = "watch-together"
version = "0.1.0"
description = "A small movie recommender for individuals and groups."
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "pandas>=2.2,<4", "streamlit>=1.42,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

# Linux containers use CPU wheels; macOS keeps its native PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
watch-together = "watch_together.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watch_together"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
